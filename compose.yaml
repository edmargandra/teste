services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: caixa
      POSTGRES_PASSWORD: caixa
      POSTGRES_DB: caixa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caixa -d caixa"]
      interval: 5s
      timeout: 5s
      retries: 20

  caixa:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/caixa
      SPRING_DATASOURCE_USERNAME: caixa
      SPRING_DATASOURCE_PASSWORD: caixa
    depends_on:
      postgres:
        condition: service_healthy

  tela:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
